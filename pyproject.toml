[project]
name = "taskforge-backend"
version = "1.0.0"
description = "A modular FastAPI demo backend for project and task collaboration"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
